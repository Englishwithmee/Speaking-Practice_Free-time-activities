<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OPEN THE BOX – FREE-TIME ACTIVITIES</title>
<style>
  :root{--ink:#24324a;--muted:#6b7280;--lav:#7c6bd9;--blue:#5aa7e8;--mint:#66c9ad;--bg1:#f8f5ff;--bg2:#eef8ff;--shadow:0 18px 40px rgba(72,78,120,.16)}
  *{box-sizing:border-box} html,body{width:100%;height:100%;margin:0;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;background:linear-gradient(135deg,var(--bg1),var(--bg2));color:var(--ink);overflow:hidden}
  body::before,body::after{content:"";position:fixed;border-radius:50%;opacity:.16;pointer-events:none} body::before{width:340px;height:340px;background:#8d7cef;top:-120px;left:-90px} body::after{width:360px;height:360px;background:#6ed2d8;bottom:-130px;right:-100px}
  .app{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:2vh 2vw}.screen{width:min(1500px,96vw);height:min(844px,94vh);background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);border-radius:28px;box-shadow:var(--shadow);backdrop-filter:blur(8px);overflow:hidden}.hidden{display:none!important}
  #home{height:100%;display:flex;flex-direction:column;padding:2.4vh 3vw 2.3vh}.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}.title-wrap{text-align:center}h1{margin:0;font-size:clamp(34px,4vw,62px);line-height:.98;color:#574abb;letter-spacing:1.5px}.subtitle{margin-top:6px;font-size:clamp(19px,1.9vw,29px);font-weight:900;letter-spacing:1.4px;color:#3678a5}.progress{justify-self:start;background:#fff;border-radius:999px;padding:10px 15px;display:flex;align-items:center;gap:9px;font-size:clamp(14px,1.15vw,18px);font-weight:900;box-shadow:0 8px 22px rgba(73,80,120,.10)}.progress-dot{width:11px;height:11px;border-radius:50%;background:var(--mint)}.reset-btn{justify-self:end;border:none;border-radius:999px;padding:10px 15px;font-weight:900;cursor:pointer;color:#6558ba;background:#fff;box-shadow:0 8px 22px rgba(73,80,120,.10);transition:.2s}.reset-btn:hover{transform:translateY(-2px)}.instruction{text-align:center;margin:1.2vh 0 1.6vh;color:var(--muted);font-size:clamp(17px,1.35vw,22px);font-weight:800}
  .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(3,1fr);gap:clamp(10px,1.2vw,18px)}.box{border:none;border-radius:24px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;font-weight:900;font-size:clamp(32px,4vw,60px);box-shadow:0 12px 24px rgba(50,65,105,.18);transition:transform .2s ease,filter .2s ease,opacity .2s ease}.box:hover:not(.done){transform:translateY(-5px) scale(1.02);filter:saturate(1.08)}.box:active:not(.done){transform:scale(.98)}.box::before{content:"";position:absolute;inset:-35%;background:linear-gradient(130deg,transparent 35%,rgba(255,255,255,.22) 50%,transparent 65%);transform:translateX(-70%) rotate(8deg);transition:transform .45s ease}.box:hover::before{transform:translateX(70%) rotate(8deg)}.box .num{position:relative;z-index:2;text-shadow:0 3px 0 rgba(0,0,0,.08)}.box .gift{position:absolute;right:15px;top:10px;font-size:clamp(20px,2vw,34px);z-index:2}.box.done{cursor:default!important;background:#b9bfca!important;opacity:.75;box-shadow:none}.box.done::after{content:"✓";position:absolute;left:14px;bottom:10px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.92);color:#657080;font-size:22px;font-weight:900;z-index:2}.c1{background:linear-gradient(145deg,#7969de,#5b4ebe)}.c2{background:linear-gradient(145deg,#5ea9ea,#4088c8)}.c3{background:linear-gradient(145deg,#65cbb0,#43a98f)}.c4{background:linear-gradient(145deg,#ef9976,#db7652)}.c5{background:linear-gradient(145deg,#ea89aa,#ce648c)}.c6{background:linear-gradient(145deg,#e7ba4f,#c99937)}
  #question{height:100%;padding:3vh 4vw;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}.q-header{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px}.box-label,.timer-pill{border-radius:999px;padding:10px 16px;font-weight:900;font-size:clamp(14px,1.2vw,19px)}.box-label{background:#efeaff;color:#5b4fc1}.timer-pill{background:#eff8ff;color:#3c7aa5}.q-main{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.8vh}.icon-bubble{width:clamp(88px,8vw,126px);height:clamp(88px,8vw,126px);border-radius:28px;background:linear-gradient(145deg,#fff,#f4f2ff);box-shadow:0 10px 26px rgba(70,75,120,.12);display:grid;place-items:center;font-size:clamp(46px,5vw,76px);animation:pop .5s ease both}.question-text{max-width:1120px;font-size:clamp(30px,3.25vw,54px);line-height:1.12;font-weight:900;color:#2d3552;animation:fadeUp .5s .08s ease both}.speak-note{color:#7a8090;font-size:clamp(16px,1.35vw,21px);font-weight:800;animation:fadeUp .5s .14s ease both}.special{display:inline-flex;align-items:center;gap:9px;padding:11px 17px;border-radius:18px;background:linear-gradient(90deg,#fff3bd,#ffe29a);color:#7d611f;font-size:clamp(15px,1.25vw,20px);font-weight:900;box-shadow:0 8px 18px rgba(160,120,30,.12);animation:pop .55s .2s ease both}.support{width:min(1080px,90%);background:#fff;border-radius:22px;padding:16px 22px;box-shadow:0 10px 24px rgba(70,75,120,.10)}.support-title{color:#5e55ae;font-weight:900;margin-bottom:9px;font-size:clamp(15px,1.25vw,20px)}.starters{display:flex;justify-content:center;flex-wrap:wrap;gap:10px}.starter{background:#f5f3ff;color:#4d5470;border-radius:14px;padding:9px 13px;font-size:clamp(14px,1.15vw,18px);font-weight:800}.actions{width:100%;display:flex;justify-content:center;gap:14px;margin-top:2vh}.action-btn{border:none;border-radius:16px;padding:13px 20px;cursor:pointer;font-weight:900;font-size:clamp(14px,1.15vw,18px);box-shadow:0 8px 20px rgba(60,70,120,.13);transition:.2s}.action-btn:hover{transform:translateY(-2px)}.back{background:#fff;color:#5e56b1}.next{background:linear-gradient(145deg,#675cd3,#5247ba);color:#fff}@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}@keyframes fadeUp{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</head>
<body>
<div class="app"><div class="screen">
<section id="home"><div class="topbar"><div class="progress"><span class="progress-dot"></span><span id="progressText">Questions completed: 0 / 15</span></div><div class="title-wrap"><h1>OPEN THE BOX</h1><div class="subtitle">FREE-TIME ACTIVITIES</div></div><button class="reset-btn" id="resetBtn">↻ RESET GAME</button></div><div class="instruction">Choose a box and answer the question!</div><div class="grid" id="boxGrid"></div></section>
<section id="question" class="hidden"><div class="q-header"><div class="box-label" id="boxLabel">🎁 BOX 1</div><div class="timer-pill">⏱ Speak for 20–30 seconds</div></div><div class="q-main"><div class="icon-bubble" id="qIcon">🎧</div><div class="question-text" id="qText">What do you like doing in your free time?</div><div class="speak-note">Try to answer in 2–4 sentences.</div><div class="special hidden" id="specialBox"></div></div><div class="support"><div class="support-title">💬 Useful Language</div><div class="starters" id="starters"></div></div><div class="actions"><button class="action-btn back" id="backBtn">← BACK TO BOXES</button><button class="action-btn next" id="nextBtn">NEXT STUDENT →</button></div></section>
</div></div>
<script>
const questions=[
{q:"What do you like doing in your free time?",icon:"🎧",starters:["I like ...","I really like ...","I usually ..."]},
{q:"Do you like shopping online? Why or why not?",icon:"🛒",starters:["Yes, I do because ...","No, I don't because ...","I usually shop for ..."]},
{q:"Have you ever baked cupcakes? What did you make?",icon:"🧁",starters:["Yes, I have. I made ...","No, I haven't, but ...","I'd like to bake ..."]},
{q:"Do you collect anything? What do you collect?",icon:"💿",starters:["Yes, I collect ...","I don't collect ...","I'd like to collect ..."]},
{q:"How often do you get together with friends?",icon:"👥",starters:["I usually meet my friends ...","We get together ...","I often ... with them."]},
{q:"What do you usually do when you meet your friends?",icon:"☕",starters:["We usually ...","Sometimes we ...","My favorite thing is ..."]},
{q:"How do you get some exercise?",icon:"🏃",starters:["I usually ...","I get exercise by ...","I often ... after school/work."]},
{q:"How often do you exercise?",icon:"🏋️",starters:["I exercise ...","I usually exercise ... times a week.","Sometimes I ..."]},
{q:"How often do you go on social media?",icon:"📱",starters:["I go on social media ...","I usually use it ...","I spend about ..."]},
{q:"What do you usually do on social media?",icon:"💬",starters:["I usually ...","I often watch ...","Sometimes I post ..."]},
{q:"Do you like going to concerts? Why or why not?",icon:"🎤",starters:["Yes, I do because ...","No, I don't because ...","I like listening to ..."]},
{q:"What kind of music do you like listening to?",icon:"🎵",starters:["I like ... music.","My favorite singer/band is ...","I listen to music when ..."]},
{q:"Can you play chess? Who do you usually play with?",icon:"♟️",starters:["Yes, I can. I play with ...","No, I can't, but ...","I usually play ..."]},
{q:"Which activity on this list do you like the most? Why?",icon:"⭐",starters:["My favorite activity is ...","I like it because ...","I usually do it ..."]},
{q:"Which activity would you like to try in the future? Why?",icon:"🚀",starters:["I'd like to try ...","I want to try it because ...","I think it will be ..."]}
];
const specials=[{title:"PAIR UP!",text:"Answer the question with a partner.",icon:"👥"},{title:"ASK A FRIEND!",text:"Choose another student to answer after you.",icon:"🙋"},{title:"EXTRA CHALLENGE!",text:"Answer using at least 3 sentences.",icon:"🔥"}];
let completed=new Set(),specialMap={};
function chooseSpecialBoxes(){const nums=[...Array(15)].map((_,i)=>i);for(let i=nums.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[nums[i],nums[j]]=[nums[j],nums[i]]}specialMap={};nums.slice(0,3).forEach((b,i)=>specialMap[b]=specials[i])}
function buildGrid(){const grid=document.getElementById("boxGrid");grid.innerHTML="";questions.forEach((_,i)=>{const btn=document.createElement("button");btn.className=`box c${(i%6)+1} ${completed.has(i)?"done":""}`;btn.innerHTML=`<span class="num">${i+1}</span><span class="gift">🎁</span>`;btn.disabled=completed.has(i);btn.onclick=()=>openBox(i);grid.appendChild(btn)});document.getElementById("progressText").textContent=`Questions completed: ${completed.size} / 15`}
function openBox(i){completed.add(i);document.getElementById("home").classList.add("hidden");document.getElementById("question").classList.remove("hidden");const item=questions[i];document.getElementById("boxLabel").textContent=`🎁 BOX ${i+1}`;document.getElementById("qText").textContent=item.q;document.getElementById("qIcon").textContent=item.icon;const st=document.getElementById("starters");st.innerHTML="";item.starters.forEach(s=>{const x=document.createElement("span");x.className="starter";x.textContent=s;st.appendChild(x)});const sp=document.getElementById("specialBox");if(specialMap[i]){const s=specialMap[i];sp.innerHTML=`${s.icon} <strong>${s.title}</strong>&nbsp; ${s.text}`;sp.classList.remove("hidden")}else{sp.classList.add("hidden");sp.innerHTML=""}saveState()}
function goHome(){document.getElementById("question").classList.add("hidden");document.getElementById("home").classList.remove("hidden");buildGrid()}
function resetGame(){if(!confirm("Reset all boxes and start a new game?"))return;completed.clear();chooseSpecialBoxes();localStorage.removeItem("openBoxFreeTimeActivities");goHome()}
function saveState(){localStorage.setItem("openBoxFreeTimeActivities",JSON.stringify({completed:[...completed],specialMap}))}
function loadState(){const raw=localStorage.getItem("openBoxFreeTimeActivities");if(!raw){chooseSpecialBoxes();return}try{const data=JSON.parse(raw);completed=new Set(data.completed||[]);specialMap=data.specialMap||{};if(Object.keys(specialMap).length!==3)chooseSpecialBoxes()}catch{chooseSpecialBoxes()}}
document.getElementById("backBtn").onclick=goHome;document.getElementById("nextBtn").onclick=goHome;document.getElementById("resetBtn").onclick=resetGame;loadState();buildGrid();
</script>
</body>
</html>
